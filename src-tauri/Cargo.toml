[package]
name = "vox-launcher"
version = "0.3.1"
description = "Vox Launcher: a fast Minecraft: Java Edition launcher"
authors = ["sylphiras"]
license = "GPL-3.0-only"
repository = "https://github.com/sylphiras/vox-launcher"
publish = false
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "vox_launcher_lib"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "net"] }
reqwest = { version = "0.12", features = ["stream", "json", "multipart", "socks"] }
futures-util = "0.3"
anyhow = "1"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
open = "5"
regex = "1"
url = "2"
discord-rich-presence = "1.1.0"
ed25519-dalek = "2"
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = false

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
